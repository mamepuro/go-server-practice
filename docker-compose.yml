services: 
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - 1232:8080
  db:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: go_server_practice_dev
    volumes:
      - go-server-practice:/var/lib/postgresql/data
volumes:
  go-server-practice: